<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>근태</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="xlTitlebar" class="xltitlebar">
    <span class="xlicon">X</span>
    <span class="xlfile">근태 — 근무시간.xlsx</span>
  </div>
  <div id="xlFormula" class="xlformula">
    <span class="fb-ref"><span id="fbRefText"></span><span class="fb-caret">▾</span></span>
    <span class="fb-fx">fx</span>
    <span id="fbVal" class="fb-val"></span>
  </div>
  <div class="wrap">
    <div class="topbar">
      <button id="prevWeek" class="navbtn" title="지난 주">◀</button>
      <div id="weekLabel" class="weeklabel">이번 주</div>
      <button id="nextWeek" class="navbtn" title="다음 주">▶</button>
      <div class="spacer"></div>
      <button id="mealBtn" class="themebtn" title="이번 주 식단표 보기">식단</button>
      <button id="themeBtn" class="themebtn" title="다크 / 엑셀 테마 전환">엑셀</button>
      <button id="ehrBtn" class="ehrbtn" title="EHR에서 실제 출퇴근 가져오기">로그인</button>
    </div>

    <div class="settingbar">
      <span class="settinglabel">기본 출근 예정</span>
      <input id="defaultIn" class="settinginput" placeholder="09:00" />
    </div>

    <table id="grid">
      <thead>
        <tr id="colRow">
          <th class="snum scorner"></th>
          <th class="scol scol-label">A</th>
          <th class="scol">B</th>
          <th class="scol">C</th>
          <th class="scol">D</th>
          <th class="scol">E</th>
          <th class="scol">F</th>
        </tr>
        <tr id="headRow"></tr>
      </thead>
      <tbody>
        <tr id="rowType"><th class="snum">2</th><th class="rowlabel">연차/휴일</th></tr>
        <tr id="rowIn"><th class="snum">3</th><th class="rowlabel">출근 시간</th></tr>
        <tr id="rowOut"><th class="snum">4</th><th class="rowlabel">퇴근 시간</th></tr>
        <tr id="rowWork"><th class="snum">5</th><th class="rowlabel">근무 시간</th></tr>
        <tr id="rowEstOut"><th class="snum">6</th><th class="rowlabel">예상 퇴근</th></tr>
      </tbody>
    </table>

    <div class="sumcap">현재 시각 기준</div>
    <div class="summary">
      <div class="cell label">현재 시간</div>
      <div id="sNow" class="cell val"></div>
      <div class="cell label">잔여 근무</div>
      <div id="sRemainNow" class="cell val"></div>
      <div class="cell label">주간 누적</div>
      <div id="sCumNow" class="cell val"></div>
    </div>

    <div class="sumcap">예정 포함 — 입력한 퇴근시간 기준 · 주 40h</div>
    <div class="summary">
      <div class="cell label">주간 누적</div>
      <div id="sCumPlan" class="cell val"></div>
      <div class="cell label">주간 잔여</div>
      <div id="sRemainPlan" class="cell val"></div>
      <div class="cell label">주 목표</div>
      <div id="sTarget" class="cell val"></div>
    </div>

    <div id="statusLine" class="status"></div>

    <div id="mealPanel" class="mealpanel">
      <div class="mealbar">
        <button id="mealReload" class="ehrbtn" title="게시판에서 이번 주 식단표 새로 가져오기">불러오기</button>
        <span id="mealCaption" class="mealcaption"></span>
        <div class="spacer"></div>
        <a id="mealOrigin" class="mealorigin" href="#" hidden>원본(게시판) 열기 ↗</a>
      </div>
      <div id="mealBody" class="mealbody">
        <div id="mealHint" class="mealhint">‘불러오기’를 눌러 이번 주 식단표를 가져오세요.</div>
        <img id="mealImg" class="mealimg" hidden alt="주간식단표" />
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
